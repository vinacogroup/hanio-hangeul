<script>
(function(){
const VOWELS = [

const VOWEL_G3 = VOWELS.filter(x=>['ㅐ','ㅔ','ㅒ','ㅖ'].includes(x[0]));

const CONS_BASIC = [...CONS_PLAIN_1,...CONS_PLAIN_2,...CONS_ASPIRATE];
const FINALS_SINGLE = [['ㄱ','악'],['ㄲ','밖'],['ㅋ','부엌'],['ㄴ','산'],['ㄷ','곧'],['ㅅ','옷'],['ㅆ','있다'],['ㅈ','낮'],['ㅊ','꽃'],['ㅌ','끝'],['ㅎ','좋다'],['ㄹ','달'],['ㅁ','밤'],['ㅂ','밥'],['ㅍ','앞'],['ㅇ','방']];

const stages = [
 {t:'Cấu tạo chữ Hàn',s:'Hiểu khối âm tiết',d:'Hiểu cách phụ âm và nguyên âm ghép thành một khối. Đây là cơ chế nền để tự đọc chữ mới.',kind:'blocks',goal:['Nhận ra vị trí phụ âm đầu','Nhận ra vị trí nguyên âm','Hiểu có thể có phụ âm cuối']},
 {t:'Nguyên âm – Phần 1',s:'ㅏ ㅓ ㅗ ㅜ ㅡ ㅣ',d:'6 nguyên âm nền tảng: ㅏ, ㅓ, ㅗ, ㅜ, ㅡ, ㅣ.',kind:'symbols',items:VOWEL_G1,goal:['Nhận diện mặt chữ','Nghe và phân biệt','Đọc trực tiếp']},
 {t:'Nguyên âm – Phần 2',s:'ㅑ ㅕ ㅛ ㅠ',d:'4 nguyên âm có âm y: ㅑ, ㅕ, ㅛ, ㅠ.',kind:'symbols',items:VOWEL_G2,goal:['Nhận diện mặt chữ','Nghe và phân biệt','Đọc trực tiếp']},
 {t:'Nguyên âm – Phần 3',s:'ㅐ ㅔ ㅒ ㅖ',d:'4 nguyên âm: ㅐ, ㅔ, ㅒ, ㅖ. Trong tiếng Hàn hiện đại, một số âm có thể nghe rất gần nhau.',kind:'symbols',items:VOWEL_G3,goal:['Nhận diện mặt chữ','Nghe và phân biệt','Đọc trực tiếp']},
 {t:'Nguyên âm – Phần 4',s:'ㅘ ㅙ ㅚ',d:'Học nhóm nguyên âm ghép từ ㅗ.',kind:'symbols',items:VOWEL_G4,goal:['Nhận ra cấu tạo','Đọc được âm tiết mới']},
 {t:'Nguyên âm – Phần 5',s:'ㅝ ㅞ ㅟ',d:'Học nhóm nguyên âm ghép từ ㅜ.',kind:'symbols',items:VOWEL_G5,goal:['Nhận ra cấu tạo','Đọc được âm tiết mới']},
 {t:'Nguyên âm – Phần 6',s:'ㅢ + tổng hợp 21 nguyên âm',d:'Học ㅢ và ôn tổng hợp đủ 21 nguyên âm hiện đại.',kind:'allVowels',items:VOWELS,goal:['Đủ 21 nguyên âm','Nhận diện và đọc trực tiếp']},
 {t:'Phụ âm thường – Phần 1',s:'ㄱ ㄷ ㅂ ㅅ ㅈ',d:'5 phụ âm thường có cặp bật hơi và cặp căng tương ứng. Học trước để làm cơ sở nhận biết các nhóm sau.',kind:'symbols',items:CONS_PLAIN_1,goal:['Nhìn – nghe – ghép','Đọc âm tiết mới','Làm nền cho nhóm bật hơi và căng']},

 {t:'Cấu tạo 받침',s:'Phụ âm cuối',d:'Hiểu vị trí 받침 và cách một âm tiết có thể có phụ âm cuối.',kind:'finalIntro',goal:['Xác định đúng 받침','Đọc được âm tiết CVC']},
 {t:'받침 đơn – đầy đủ',s:'16 cách viết, 7 âm cuối',d:'Học đầy đủ các phụ âm đơn có thể xuất hiện ở cuối âm tiết và quy về 7 âm cuối cơ bản.',kind:'finalSingle',items:FINALS_SINGLE,goal:['Biết mặt chữ cuối','Nhận ra 7 nhóm âm cuối']},
 {t:'받침 kép – đầy đủ',s:'ㄳ ㄵ ㄶ ㄺ ㄻ ㄼ ㄽ ㄾ ㄿ ㅀ ㅄ',d:'Học đầy đủ 11 받침 kép và ví dụ từ thật.',kind:'finalDouble',items:FINALS_DOUBLE,goal:['Đủ 11 받침 kép','Nhận diện khi gặp trong từ']},

// One reusable element, so a new click replaces whatever is sounding instead of layering on it.
// Resolves true when the clip actually sounded, false when it could not, so the caller can
// fall back to TTS instead of leaving a dead button.
let audioEl=null, playToken=0;
function stopAudio(){playToken++;if(audioEl){audioEl.pause();audioEl.currentTime=0}}
const CLIP_START_TIMEOUT_MS=1500;
function playClip(src,token){return new Promise(resolve=>{
 if(!audioEl){audioEl=new Audio();audioEl.preload='auto'}
 let settled=false, timer=null;
 const done=ok=>{if(settled)return;settled=true;clearTimeout(timer);
  audioEl.onended=audioEl.onerror=audioEl.onplaying=null;resolve(ok)};
 audioEl.onended=()=>done(true);
 audioEl.onerror=()=>done(false);                      // 404 or unsupported codec
 // If the file never even starts (stalled network, blocked media), give up and let TTS speak
 // rather than leaving a silent button. Cancelled once playback is actually under way.
 timer=setTimeout(()=>done(false),CLIP_START_TIMEOUT_MS);
 audioEl.onplaying=()=>{clearTimeout(timer)};
 audioEl.src=src;
 audioEl.play().then(()=>{},()=>done(false));
 if(token!==playToken)done(true)})}                    // superseded: caller must not re-speak

// spell=true separates syllables so each letter stays audible. Only for letter drills:
// real words must stay connected or the liaison and sound-change lessons teach the wrong thing.
async function speak(text,spell){if(!('speechSynthesis'in window)){alert('Trình duyệt này chưa hỗ trợ đọc tiếng Hàn.');return}
 speechSynthesis.cancel();stopAudio();
 const token=playToken;
 if(!spell){const clip=clipFor(text);
  if(clip&&await playClip(clip,token))return;
  if(token!==playToken)return;
  speechSynthesis.speak(utter(text,SPEAK_RATE));return}
 const syllables=[...String(text).trim()].filter(c=>c.trim());
 for(let i=0;i<syllables.length;i++){
  if(token!==playToken)return;                       // a newer click superseded this one
  const s=syllables[i], clip=clipFor(s);
  if(i)await new Promise(r=>setTimeout(r,CLIP_GAP_MS));
  if(token!==playToken)return;
  if(clip&&await playClip(clip,token))continue;
  if(token!==playToken)return;
  speechSynthesis.speak(utter(s,SPEAK_RATE_DRILL))}}

function wordReader(words,pseudo){return `<div class="grid2"><div class="card"><h4>${pseudo?'Từ chưa từng gặp':'Danh sách luyện đọc'}</h4><div class="symbolGrid">${words.map(w=>`<button type="button" class="symbol wordCard" data-word="${w}"><b style="font-size:24px">${w}</b><small>Đọc trước → nhấn nghe</small></button>`).join('')}</div></div><div class="card"><h4>Kiểm tra độc lập</h4><p>${pseudo?'Các chuỗi này không cần có nghĩa. Nếu đọc được, học viên đã hiểu cơ chế giải mã chữ.':'Không học thuộc trước. Đọc bằng cách nhìn chữ và giải mã trực tiếp.'}</p><div class="callout">Đọc trước rồi nhấn vào từng từ để nghe đối chiếu.</div><div class="readBox"><b id="wordCount">0</b> / ${words.length} từ đã kiểm tra.</div><button class="btn green" id="wordDone" style="margin-top:12px" disabled>Đã kiểm tra</button></div></div>`}
function sentenceReader(sentences){return `<div class="card"><h4>Đọc cụm và câu ngắn</h4><p>Đọc từng câu trước, sau đó mới nhấn nghe.</p>${sentences.map(s=>`<div class="readBox"><div class="row" style="justify-content:space-between"><div class="readText" style="font-size:24px">${s}</div><button type="button" class="btn ghost speakMini" data-speak="${s}">🔊</button></div></div>`).join('')}<button class="btn green" id="sentenceDone" style="margin-top:12px">Đã kiểm tra toàn bộ câu</button></div>`}
function finalGate(){const text='안녕하세요. 저는 베트남 사람입니다. 제 이름은 민입니다. 저는 학생입니다. 한국어를 공부합니다. 만나서 반갑습니다.';return `<div class="grid2"><div class="card"><h4>Bài đọc cuối chặng</h4><p>Đây là đoạn kiểm tra. Học viên đọc trước khi nghe. Đọc trước khi nhấn nghe mẫu.</p><div class="readBox"><div class="readText">${text}</div></div><div class="row" style="margin-top:12px"><button class="btn ghost" id="finalSpeak">🔊 Nghe sau khi đọc</button></div></div><div class="card"><h4>Đo 60 giây</h4><p>Nhấn bắt đầu, đọc liên tục. Sau 60 giây nhập số âm tiết đọc đúng.</p><div class="timer"><strong id="timeLeft">60</strong><span>giây</span></div><button class="btn red" id="startTimer">Bắt đầu 60 giây</button><label style="display:block;margin-top:12px;font-weight:800">Số âm tiết đọc đúng trong 60 giây</label><input class="inputLine" id="speedInput" type="number" min="0" max="300" placeholder="Ví dụ: 36"><label style="display:block;margin-top:12px;font-weight:800">Độ chính xác (%)</label><input class="inputLine" id="accuracyInput" type="number" min="0" max="100" placeholder="Ví dụ: 85"><button class="btn green" id="finalSubmit" style="margin-top:12px">Kiểm tra điều kiện vượt chặng</button><div class="feedback" id="finalFb"></div></div></div>`}
function bindDynamic(st){
 $$('.symbol[data-speak]').forEach(b=>b.addEventListener('click',()=>speak(b.dataset.speak,true)));
 $$('.speakMini').forEach(b=>b.addEventListener('click',()=>speak(b.dataset.speak)));
 $$('.wordCard').forEach(b=>b.addEventListener('click',()=>{speak(b.dataset.word);if(!b.dataset.done){b.dataset.done='1';b.style.borderColor='#9bd3b1';b.style.background='#f0faf4';updateWordCount()}}));
 $$('.simpleChoice').forEach(b=>b.addEventListener('click',()=>{const ok=b.dataset.value===b.dataset.answer;$$('.simpleChoice').forEach(x=>x.disabled=true);b.classList.add(ok?'correct':'wrong');$('#simpleFb').textContent=ok?'Đúng. Màn đã đạt.':'Chưa đúng. Hãy xem lại rồi làm lại màn.';if(ok)markDone(current,100)}));
 const qd=$('#quizData');if(qd)runPairQuiz(JSON.parse(decodeURIComponent(qd.dataset.json||'%5B%5D')));
 if($('#blendNew'))bindBlend();
 if($('#ruleDone'))$('#ruleDone').addEventListener('click',()=>markDone(current,90));
 if($('#wordDone'))$('#wordDone').addEventListener('click',()=>markDone(current,90));
 if($('#sentenceDone'))$('#sentenceDone').addEventListener('click',()=>markDone(current,90));
 if($('#finalSpeak'))$('#finalSpeak').addEventListener('click',()=>speak('안녕하세요. 저는 베트남 사람입니다. 제 이름은 민입니다. 저는 학생입니다. 한국어를 공부합니다. 만나서 반갑습니다.'));
 if($('#startTimer'))$('#startTimer').addEventListener('click',startTimer);
 if($('#finalSubmit'))$('#finalSubmit').addEventListener('click',submitFinal);
}
function runPairQuiz(qs){let qi=0,correct=0;const area=$('#quizArea');function next(){if(qi>=qs.length){const pct=Math.round(correct/qs.length*100);area.innerHTML=`<div class="questionBox"><div class="prompt">Kết quả: ${correct}/${qs.length} – ${pct}%</div><div class="feedback">${pct>=80?'Kết quả tốt.':'Có thể luyện lại để tăng độ chính xác.'}</div><button class="btn ${pct>=80?'green':'red'}" id="quizEnd">${pct>=80?'Làm lại bài kiểm tra':'Làm lại'}</button></div>`;$('#quizEnd').onclick=()=>{renderStage()};return}const [char,audio]=qs[qi];const pool=shuffle(qs.map(x=>x[0]).filter(x=>x!==char)).slice(0,3);const opts=shuffle([char,...pool]);area.innerHTML=`<div class="questionBox"><div class="prompt">Nghe rồi chọn chữ đúng</div><button class="btn ghost" id="playQ" style="margin-top:10px">🔊 Nghe</button><div class="choices">${opts.map(x=>`<button type="button" class="choice qChoice" data-v="${x}">${x}</button>`).join('')}</div><div class="feedback" id="qFb"></div></div>`;$('#playQ').onclick=()=>speak(audio,true);$$('.qChoice').forEach(b=>b.onclick=()=>{const ok=b.dataset.v===char;if(ok){correct++;b.classList.add('correct');$('#qFb').textContent='Đúng.'}else{b.classList.add('wrong');$('#qFb').textContent='Chưa đúng.'}$$('.qChoice').forEach(x=>x.disabled=true);setTimeout(()=>{qi++;next()},650)})}next()}
function bindBlend(){let count=0;const data=$('#blendData');const cons=JSON.parse(data.dataset.cons),vows=JSON.parse(data.dataset.vows);let currentS='가';function make(){const c=cons[Math.floor(Math.random()*cons.length)],v=vows[Math.floor(Math.random()*vows.length)];const leadMap={'ㄱ':0,'ㄲ':1,'ㄴ':2,'ㄷ':3,'ㄸ':4,'ㄹ':5,'ㅁ':6,'ㅂ':7,'ㅃ':8,'ㅅ':9,'ㅆ':10,'ㅇ':11,'ㅈ':12,'ㅉ':13,'ㅊ':14,'ㅋ':15,'ㅌ':16,'ㅍ':17,'ㅎ':18};const vowMap={'ㅏ':0,'ㅐ':1,'ㅑ':2,'ㅒ':3,'ㅓ':4,'ㅔ':5,'ㅕ':6,'ㅖ':7,'ㅗ':8,'ㅘ':9,'ㅙ':10,'ㅚ':11,'ㅛ':12,'ㅜ':13,'ㅝ':14,'ㅞ':15,'ㅟ':16,'ㅠ':17,'ㅡ':18,'ㅢ':19,'ㅣ':20};currentS=String.fromCharCode(0xAC00+(leadMap[c]*21+vowMap[v])*28);$('#blendTarget').textContent=currentS}$('#blendNew').onclick=make;$('#blendSpeak').onclick=()=>speak(currentS);$('#blendDone').onclick=()=>{count++;$('#blendCount').textContent=count;if(count>=12){markDone(current,100);$('#blendDone').disabled=true} else make()};make()}
function updateWordCount(){const done=$$('.wordCard[data-done="1"]').length,total=$$('.wordCard').length;$('#wordCount').textContent=done;if(done===total)$('#wordDone').disabled=false}
function markDone(i,score){}
function startTimer(){clearInterval(timerInt);seconds=60;$('#timeLeft').textContent=seconds;$('#startTimer').disabled=true;timerInt=setInterval(()=>{seconds--;$('#timeLeft').textContent=seconds;if(seconds<=0){clearInterval(timerInt);$('#startTimer').disabled=false;speak('그만')}} ,1000)}
function submitFinal(){const sp=Math.max(0,Math.min(300,Number($('#speedInput').value)||0));const ac=Math.max(0,Math.min(100,Number($('#accuracyInput').value)||0));sessionProgress.speed=sp;sessionProgress.accuracy=ac;updateSessionProgress();const ok=sp>=30&&ac>=80;$('#finalFb').textContent=ok?'Đạt chuẩn Chặng 0. Có thể chuyển sang Bài 1.':'Chưa đạt chuẩn. Cần ≥ 30 âm tiết/phút và ≥ 80% độ chính xác.';$('#finalFb').style.color=ok?'#17623c':'#8b1930';if(ok)markDone(current,ac)}
$('#navTitle').textContent=stages.length+' màn học';
renderJourney();renderProgress();renderStage();
})();
</script>
